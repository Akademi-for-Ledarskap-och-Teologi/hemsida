<!--
  ============================================================
  ALT – DAGENS ORD (grekiska) – för altutbildning.se
  ============================================================
  Klistra in HELA filen i ett Squarespace-kodblock.
  Design: samma formspråk som kurskatalogen och ansökningsguiden.
  Orden byts automatiskt varje dag (samma ord för alla besökare samma dag).
  Bara grekiskan visas. Vill du ta tillbaka hebreiskan: ta bort // framför
  hebreiska-raden i LANGS längre ner och sätt .ao-grid till repeat(2,minmax(0,1fr)).
  Lägg till fler ord i listorna GR och HE längre ner:
    [ord, translitteration, betydelse, förklaring, Strong-nummer, versreferens]
  ============================================================
-->
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=EB+Garamond:ital,wght@0,400;0,600;1,400&amp;family=Noto+Serif+Hebrew:wght@400;600&amp;display=swap">
<div id="altord">
  <header class="ao-head">
    <div>
      <p class="ao-eyebrow ao-date"></p>
      <h2 class="ao-title">Dagens ord</h2>
      <p class="ao-lead">Gissa vad ordet betyder – och vänd sedan kortet.</p>
    </div>
  </header>
  <div class="ao-grid"></div>
  <p class="ao-streak" aria-live="polite"></p>
</div>

<style>
#altord{
  --bg:#EDE5E0; --card:#FBF9F7; --ink:#1c1c1c; --muted:#5a5652; --accent:#c07a63; --teal:#2f575f; --line:rgba(28,28,28,.1);
  --head:"Archivo Black","Arial Black",Helvetica,sans-serif; --text:"EB Garamond",Garamond,Georgia,serif;
  --heb:"Noto Serif Hebrew","SBL Hebrew","Times New Roman",serif;
  --r:24px; --r-sm:16px;
  --shadow:0 1px 2px rgba(28,28,28,.04),0 8px 24px rgba(28,28,28,.06);
  --shadow-lg:0 2px 6px rgba(28,28,28,.06),0 24px 48px rgba(28,28,28,.14);
  --ease:cubic-bezier(.2,.8,.2,1);
  color:var(--ink); font-family:var(--text); font-size:19px; line-height:1.5; width:100%; -webkit-font-smoothing:antialiased;
}
#altord *{box-sizing:border-box}
#altord button{font:inherit;color:inherit}
#altord h2,#altord h3,#altord p{margin:0;color:inherit}
#altord h2,#altord h3{font-family:var(--head);font-weight:400;line-height:1.08;letter-spacing:-.01em}
#altord :focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@keyframes ao-up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes ao-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}

/* ---------- Rubrik ---------- */
#altord .ao-head{display:flex;justify-content:space-between;align-items:flex-end;gap:6px 24px;flex-wrap:wrap;margin-bottom:18px}
#altord .ao-head > div:first-child{max-width:640px}
#altord .ao-eyebrow{font-family:var(--head);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
#altord .ao-title{font-size:clamp(28px,4vw,40px);text-transform:uppercase;margin:6px 0 0}
#altord .ao-lead{font-size:18px;color:var(--muted)}

/* ---------- Kort ---------- */
#altord .ao-grid{display:grid;grid-template-columns:1fr;gap:20px}
#altord .ao-flip{perspective:1600px;animation:ao-up .6s var(--ease) both}
#altord .ao-flip:nth-child(2){animation-delay:.08s}
#altord .ao-flip{display:flex}
#altord .ao-inner{flex:1;display:grid;min-height:270px;transition:transform .85s var(--ease);transform-style:preserve-3d}
#altord .ao-flip.is-flipped .ao-inner{transform:rotateY(180deg)}
#altord .ao-face{grid-area:1/1;position:relative;overflow:hidden;border-radius:var(--r);-webkit-backface-visibility:hidden;backface-visibility:hidden;container-type:inline-size;display:flex;flex-direction:column;padding:22px 28px 20px;isolation:isolate}
#altord .ao-front{background:var(--tc);color:var(--tf);box-shadow:var(--shadow);cursor:pointer;border:0;text-align:left;width:100%;transition:box-shadow .45s var(--ease)}
#altord .ao-front:hover{box-shadow:var(--shadow-lg)}
#altord .ao-back{background:var(--card);color:var(--ink);box-shadow:var(--shadow-lg);transform:rotateY(180deg);gap:8px}
#altord .ao-back::before{content:"";position:absolute;inset:0 0 auto 0;height:10px;background:var(--tc)}

/* Bågar (samma motiv som kurskatalogens programkort) */
#altord .ao-arches{position:absolute;right:-6%;top:22px;height:135%;width:auto;color:currentColor;opacity:.14;pointer-events:none;z-index:-1;transition:transform 1.2s var(--ease)}
#altord .ao-arches path{fill:none;stroke:currentColor;stroke-width:55}
#altord .ao-front:hover .ao-arches{transform:translateY(-14px) scale(1.03)}

#altord .ao-lang{font-family:var(--head);font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;display:flex;justify-content:space-between;gap:12px}
#altord .ao-lang .n{opacity:.7}
#altord .ao-word{font-size:clamp(34px,calc(130cqi / var(--n)),72px);line-height:1.15;margin:auto 0 2px;padding-top:8px;font-family:var(--text);font-weight:400;white-space:nowrap}
#altord .ao-word.he{font-family:var(--heb);direction:rtl;text-align:right}
#altord .ao-word .ch{display:inline-block;opacity:0;transform:translateY(.25em);animation:ao-up .7s var(--ease) forwards}
#altord .ao-translit{font-size:20px;font-style:italic;opacity:.85}
#altord .ao-hint{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid color-mix(in srgb,currentColor 22%,transparent)}
#altord .ao-hint span:first-child{font-size:18px;opacity:.85}
#altord .ao-turn{flex:none;width:38px;height:38px;border-radius:25%;background:rgba(255,255,255,.88);color:#1c1c1c;display:grid;place-content:center;font-size:20px;transition:transform .45s var(--ease)}
#altord .ao-front:hover .ao-turn{transform:rotate(180deg)}

/* Baksida */
#altord .ao-back .ao-lang{color:var(--tc);opacity:1;filter:saturate(1.1) brightness(.85);margin-top:6px}
#altord .ao-small{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
#altord .ao-small b{font-weight:400;font-size:28px;line-height:1.1}
#altord .ao-small b.he{font-family:var(--heb);direction:rtl}
#altord .ao-small i{color:var(--muted);font-size:19px}
#altord .ao-mean{font-family:var(--head);font-size:clamp(22px,6cqi,30px);text-transform:uppercase;line-height:1.05;letter-spacing:-.01em}
#altord .ao-text{font-size:17px;line-height:1.5;color:#2d2b29}
#altord .ao-meta{display:flex;flex-wrap:wrap;gap:6px}
#altord .ao-tag{font-size:15px;line-height:1.3;border-radius:6px;padding:4px 10px;background:var(--bg)}
#altord a.ao-ref{color:#fff;background:var(--tc);text-decoration:none;font-weight:600;transition:transform .2s var(--ease)}
#altord a.ao-ref:hover{transform:scale(1.05)}
#altord .ao-acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:8px}
#altord .ao-btn.ao-more{background:var(--tc);color:#fff;text-decoration:none}
#altord .ao-more .arr{transition:transform .2s var(--ease)}
#altord .ao-more:hover .arr{transform:translateX(3px)}
#altord .ao-btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;font-family:var(--head);font-size:12px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;background:var(--ink);color:#fff;transition:transform .2s var(--ease),background .2s}
#altord .ao-btn:hover{transform:scale(1.04)}
#altord .ao-btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
#altord .ao-btn.speaking{animation:ao-wiggle .5s ease-in-out infinite}

#altord .ao-streak{margin-top:12px;text-align:center;font-family:var(--head);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-height:1em}
#altord .ao-streak b{font-weight:400;color:var(--accent)}

@media(max-width:820px){
  #altord .ao-grid{grid-template-columns:1fr;gap:16px}
  #altord .ao-inner{min-height:240px}
}
@media(max-width:640px){
  #altord{font-size:18px}
  #altord .ao-lead{font-size:19px}
  #altord .ao-face{padding:24px 22px 20px}
  #altord .ao-head{margin-bottom:24px}
}
@media(prefers-reduced-motion:reduce){
  #altord *,#altord *::before,#altord *::after{animation:none!important;transition:none!important}
  #altord .ao-word .ch{opacity:1;transform:none}
  #altord .ao-flip.is-flipped .ao-front{visibility:hidden}
}
</style>

<script>
(function(){
'use strict';
var root = document.getElementById('altord');
if (!root || root.dataset.ready) return;
root.dataset.ready = '1';

/* [ord, translitteration, betydelse, förklaring, Strong-nummer, versreferens] */
var GR = [
  ["ἀγάπη","agápē","Kärlek","Den självgivande kärleken som söker den andras bästa. Paulus ägnar ett helt kapitel åt den.","G26","1 Kor 13:4"],
  ["λόγος","lógos","Ord","Betyder ord, tal eller förnuft. Johannes använder det om Kristus själv: Ordet som var hos Gud.","G3056","Joh 1:1"],
  ["χάρις","cháris","Nåd","En gåva som ges fritt och oförtjänt. Samma rot finns i chara (glädje) och eucharistia (tacksägelse).","G5485","Ef 2:8"],
  ["πίστις","pístis","Tro, förtroende","Inte bara att hålla något för sant, utan att lita på och vara trofast mot någon.","G4102","Heb 11:1"],
  ["ἐλπίς","elpís","Hopp","En förväntan som vilar på Guds löfte, inte en vag önskan.","G1680","Rom 5:5"],
  ["εἰρήνη","eirḗnē","Frid","Motsvarar ofta hebreiskans shalom, alltså frid som helhet och välgång, inte bara frånvaro av konflikt.","G1515","Joh 14:27"],
  ["μετάνοια","metánoia","Omvändelse","Ordagrant ”ett omtänkande”, en ändring av sinne och riktning.","G3341","Luk 15:7"],
  ["ἐκκλησία","ekklēsía","Församling","Av ek-kaleō, ”kalla ut”. I den grekiska staden var det en sammankallad folkförsamling.","G1577","Matt 16:18"],
  ["εὐαγγέλιον","euangélion","Evangelium","”Gott budskap”. Användes om segerbud och kejserliga kungörelser.","G2098","Mark 1:1"],
  ["κοινωνία","koinōnía","Gemenskap","Delaktighet i något gemensamt, även att dela med sig av det man har.","G2842","Apg 2:42"],
  ["δόξα","dóxa","Härlighet, ära","Från början ”åsikt” eller ”rykte”, i Bibeln Guds strålande närvaro. Därav ordet doxologi.","G1391","Luk 2:14"],
  ["σάρξ","sárx","Kött","Kan betyda kropp, människans svaghet eller hela den mänskliga naturen. Ordet blev sarx.","G4561","Joh 1:14"],
  ["πνεῦμα","pneûma","Ande, vind","Samma ord för ande, vind och andning. Jesus leker med dubbelbetydelsen i samtalet med Nikodemos.","G4151","Joh 3:8"],
  ["ψυχή","psychḗ","Själ, liv","Människans liv och jag. Därav psykologi.","G5590","Matt 16:25"],
  ["σωτηρία","sōtēría","Frälsning","Räddning, befrielse, att bli helad. Läran om frälsningen kallas soteriologi.","G4991","Rom 1:16"],
  ["βασιλεία","basileía","Rike, kungavälde","Mer Guds regerande än ett geografiskt område.","G932","Matt 6:10"],
  ["καιρός","kairós","Rätt tid","Till skillnad från chronos (klocktid) är kairos det avgörande ögonblicket.","G2540","Mark 1:15"],
  ["παράκλητος","paráklētos","Hjälpare","”Den som kallas till ens sida”: försvarare, tröstare, rådgivare.","G3875","Joh 14:16"],
  ["διάκονος","diákonos","Tjänare","Någon som utför en tjänst, till exempel serverar vid bordet. Därav diakon.","G1249","Mark 10:43"],
  ["μαθητής","mathētḗs","Lärjunge","Elev, den som lär sig genom att följa sin lärare.","G3101","Luk 14:27"],
  ["ἀλήθεια","alḗtheia","Sanning","Ordagrant ”det som inte är dolt”.","G225","Joh 14:6"],
  ["ζωή","zōḗ","Liv","Livet i dess fullhet, ofta det eviga livet hos Johannes.","G2222","Joh 10:10"],
  ["φῶς","phôs","Ljus","Därav foto- och fosfor (”ljusbärare”).","G5457","Joh 8:12"],
  ["σπλαγχνίζομαι","splanchnízomai","Fyllas av medlidande","Bildat av ordet för inälvor. Medkänslan känns ända in i magen.","G4697","Luk 15:20"],
  ["μακάριος","makários","Salig, lycklig","Inleder varje saligprisning i Bergspredikan.","G3107","Matt 5:3"],
  ["ταπεινοφροσύνη","tapeinophrosýnē","Ödmjukhet","”Lågt sinnelag”. I den grekiska omvärlden var det knappast en dygd, men i Nya testamentet blir det en.","G5012","Fil 2:3"],
  ["ἀνάστασις","anástasis","Uppståndelse","Ordagrant ”att resa sig upp”.","G386","Joh 11:25"],
  ["κενόω","kenóō","Utblotta, tömma","Därav kenos-teologin om hur Kristus avstod från sin gudomliga ställning.","G2758","Fil 2:7"],
  ["ὑπομονή","hypomonḗ","Uthållighet","”Att stanna kvar under”, att bära en börda utan att ge upp.","G5281","Jak 1:3"],
  ["ποιμήν","poimḗn","Herde","Därav pastor (latin för herde) och poimenik, läran om själavård.","G4166","Joh 10:11"],
  ["παρρησία","parrēsía","Frimodighet","Frihet att säga allt, att tala öppet och utan rädsla.","G3954","Apg 4:31"],
  ["οἰκοδομή","oikodomḗ","Uppbyggelse","Ordagrant ”husbygge”, att bygga upp gemenskapen.","G3619","Ef 4:12"],
  ["ἀπόστολος","apóstolos","Apostel, sändebud","Någon som är utsänd med ett uppdrag.","G652","Matt 10:2"],
  ["πραΰς","praÿs","Ödmjuk, saktmodig","Användes om ett tämjt djur: styrka under kontroll.","G4239","Matt 5:5"],
  ["ἁμαρτία", "hamartía", "Synd", "Ordagrant att missa målet, som när en pil inte träffar. Paulus talar om synden nästan som en makt.", "G266", "Rom 6:23"],
  ["δικαιοσύνη", "dikaiosýnē", "Rättfärdighet", "Ett nyckelord hos Paulus: Guds rättfärdighet som uppenbaras i evangeliet.", "G1343", "Rom 1:17"],
  ["δικαιόω", "dikaióō", "Förklara rättfärdig", "Ett ord från rättssalen: att bli frikänd. Grunden för läran om rättfärdiggörelse.", "G1344", "Rom 5:1"],
  ["ἀπολύτρωσις", "apolýtrōsis", "Återlösning", "Att friköpas, som när en slav eller fånge löses ut mot en lösensumma.", "G629", "Rom 3:24"],
  ["ἱλαστήριον", "hilastḗrion", "Försoningsställe", "Samma ord som i den grekiska översättningen av Gamla testamentet används om locket på förbundsarken, nådastolen.", "G2435", "Rom 3:25"],

  ["ἔλεος", "éleos", "Barmhärtighet", "Medlidande som leder till handling. Samma rot finns i bönen Kyrie eleison, ”Herre, förbarma dig”.", "G1656", "Luk 1:50"],
  ["ἐπίσκοπος", "epískopos", "Tillsyningsman", "Den som har uppsikt. Därav ordet biskop.", "G1985", "1 Tim 3:2"],

  ["κήρυγμα", "kḗrygma", "Förkunnelse", "Härolden ropar ut ett budskap. I teologin kallas den tidiga kyrkans kärnbudskap kerygma.", "G2782", "1 Kor 1:21"],
  ["διδαχή", "didachḗ", "Undervisning", "Lära och undervisning. Folket häpnade över hur Jesus undervisade.", "G1322", "Matt 7:28"],
  ["παραβολή", "parabolḗ", "Liknelse", "Ordagrant ”något som kastas bredvid”, en jämförelse som belyser något annat.", "G3850", "Mark 4:2"],
  ["σημεῖον", "sēmeîon", "Tecken", "Johannes kallar Jesu under för tecken: de pekar bortom sig själva.", "G4592", "Joh 2:11"],
  ["προσκυνέω", "proskynéō", "Tillbe", "Att falla ner inför någon. Jesus talar om tillbedjan i ande och sanning.", "G4352", "Joh 4:24"],
  ["εὐχαριστία", "eucharistía", "Tacksägelse", "Därav eukaristi, kyrkans namn på nattvarden.", "G2169", "Fil 4:6"],
  ["βάπτισμα", "báptisma", "Dop", "Av ett verb som betyder doppa eller sänka ner. Paulus beskriver dopet som att begravas och uppstå med Kristus.", "G908", "Rom 6:4"],
  ["σταυρός", "staurós", "Kors", "Romarrikets skamligaste avrättningsredskap, som Paulus ändå vill berömma sig av.", "G4716", "Gal 6:14"],
  ["αἷμα", "haîma", "Blod", "Bärare av liv. Vid sista måltiden talar Jesus om förbundets blod.", "G129", "Matt 26:28"],
  ["ἀρραβών", "arrabṓn", "Handpenning", "Ett ord från handeln: första delbetalningen som garanterar resten. Anden är en handpenning på arvet.", "G728", "Ef 1:14"],
  ["υἱοθεσία", "huiothesía", "Adoption", "Att bli insatt som son eller dotter med full arvsrätt.", "G5206", "Rom 8:15"],
  ["ἀββά", "abbá", "Abba, far", "Arameiskt ord för far, bevarat i grekiska texten. Jesus använder det i Getsemane.", "G5", "Mark 14:36"],
  ["μαράνα θά", "maraná thá", "Vår Herre, kom!", "En arameisk bön som stod kvar i de grekisktalande församlingarna.", "G3134", "1 Kor 16:22"],
  ["παρουσία", "parousía", "Ankomst, närvaro", "Användes om när en kung kom på besök. I Nya testamentet om Kristi återkomst.", "G3952", "1 Tess 4:15"],
  ["ἀποκάλυψις", "apokálypsis", "Uppenbarelse", "Ordagrant ”avtäckning”, att dra undan förhänget. Gav namn åt Uppenbarelseboken.", "G602", "Upp 1:1"],
  ["ἔσχατος", "éschatos", "Sist", "Kristus är den förste och den siste. Därav eskatologi, läran om de yttersta tingen.", "G2078", "Upp 22:13"],

  ["μονογενής", "monogenḗs", "Ende, enfödde", "Den ende i sitt slag. Används om Sonen i Joh 3:16.", "G3439", "Joh 3:16"],

  ["Χριστός", "Christós", "Kristus, den smorde", "Den grekiska översättningen av hebreiskans mashiach, Messias.", "G5547", "Matt 16:16"],
  ["ἐξουσία", "exousía", "Makt, fullmakt", "Rätt och myndighet att handla. Den uppståndne har fått all makt i himlen och på jorden.", "G1849", "Matt 28:18"],
  ["δύναμις", "dýnamis", "Kraft", "Förmåga och kraft. Därav dynamik och dynamit.", "G1411", "Apg 1:8"],

  ["συνείδησις", "syneídēsis", "Samvete", "Ordagrant ”med-vetande”, en inre kunskap som vittnar med oss.", "G4893", "Rom 2:15"],

/* Länkar till bibeln.se (Bibel 2026: NT 2026 och GT 2000). Förkortning -> bokkod på bibeln.se */
var LEARN_URL = 'https://altutbildning.se/utbildning';   // knappen "Vill du lära dig mer?" på baksidan
var BIBEL_URL = 'https://www.bibeln.se/bibel/B2026/';
var BOOKCODE = {
  '1 Mos':'GEN','2 Mos':'EXO','3 Mos':'LEV','4 Mos':'NUM','5 Mos':'DEU','Jos':'JOS','Dom':'JDG','Rut':'RUT','1 Sam':'1SA','2 Sam':'2SA',
  '1 Kung':'1KI','2 Kung':'2KI','Job':'JOB','Ps':'PSA','Ords':'PRO','Pred':'ECC','Höga v':'SNG','Jes':'ISA','Jer':'JER','Klag':'LAM',
  'Hes':'EZK','Dan':'DAN','Hos':'HOS','Joel':'JOL','Amos':'AMO','Jona':'JON','Mika':'MIC','Hab':'HAB','Sak':'ZEC','Mal':'MAL',
  'Matt':'MAT','Mark':'MRK','Luk':'LUK','Joh':'JHN','Apg':'ACT','Rom':'ROM','1 Kor':'1CO','2 Kor':'2CO','Gal':'GAL','Ef':'EPH',
  'Fil':'PHP','Kol':'COL','Tit':'TIT','1 Tess':'1TH','1 Tim':'1TI','2 Tim':'2TI','Heb':'HEB','Jak':'JAS','1 Pet':'1PE','2 Pet':'2PE','1 Joh':'1JN','Upp':'REV'
};
/* "Joh 1:1" -> länk till versen, "Joh 3:16-18" -> länk till verserna */
function bibUrl(ref){
  var m = String(ref).match(/^(.+?)\s+(\d+):(\d+)(?:\s*[-–]\s*(\d+))?$/), code = m && BOOKCODE[m[1]];
  if (!code) return '';
  return BIBEL_URL + code + '.' + m[2] + '.' + m[3] + '-' + code + '.' + m[2] + '.' + (m[4] || m[3]);
}

var ARCHES = '<svg class="ao-arches" viewBox="325 29 1282 1871" preserveAspectRatio="xMaxYMin meet" aria-hidden="true"><path d="M351 1900V670A614 614 0 0 1 1579 670V1900"/><path d="M442 1900V670A523 523 0 0 1 1488 670V1900"/><path d="M533 1900V670A432 432 0 0 1 1397 670V1900"/><path d="M624 1900V670A341 341 0 0 1 1306 670V1900"/><path d="M715 1900V670A250 250 0 0 1 1215 670V1900"/><path d="M806 1900V670A159 159 0 0 1 1124 670V1900"/><path d="M897 1900V670A68 68 0 0 1 1033 670V1900"/></svg>';
var LANGS = [
  { list:GR, cls:'gr', lang:'grc', tts:'el-GR', label:'Grekiska', sub:'Nya testamentet', c:'#2f575f', fg:'#ffffff', shift:0 },
  // { list:HE, cls:'he', lang:'he',  tts:'he-IL', label:'Hebreiska', sub:'Gamla testamentet', c:'#c07a63', fg:'#ffffff', shift:7 }
];
var canSpeak = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
var $ = function(s){ return root.querySelector(s); };

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function dayNo(d){ return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }
function pick(list, n){ return list[((n % list.length) + list.length) % list.length]; }
/* Bokstäverna animeras en och en. Hebreiska vokaltecken hålls ihop med sin bokstav. */
function letters(w){
  var parts = w.match(/[^֑-ׇ̀-ͯ][֑-ׇ̀-ͯ]*/g) || [w];
  return parts.map(function(p, i){ return '<span class="ch" style="animation-delay:' + (0.15 + i * 0.05).toFixed(2) + 's">' + esc(p) + '</span>'; }).join('');
}

function cardHtml(L, w, i){
  var n = Math.max(5, w[0].replace(/[֑-ׇ̀-ͯ]/g, '').length);
  var listen = canSpeak ? '<button type="button" class="ao-btn" data-act="say" data-i="' + i + '" title="Modernt uttal via webbläsarens röst">Lyssna ♪</button>' : '';
  return '<div class="ao-flip" style="--tc:' + L.c + ';--tf:' + L.fg + '">' +
    '<div class="ao-inner">' +
      '<button type="button" class="ao-face ao-front" data-act="flip" aria-label="' + L.label + ': ' + esc(w[1]) + '. Vänd kortet för att se betydelsen">' + ARCHES +
        '<span class="ao-lang"><span>' + L.label + '</span><span class="n">' + L.sub + '</span></span>' +
        '<span class="ao-word ' + L.cls + '" lang="' + L.lang + '" style="--n:' + n + '">' + (L.cls === 'he' ? esc(w[0]) : letters(w[0])) + '</span>' +
        '<span class="ao-translit">' + esc(w[1]) + '</span>' +
        '<span class="ao-hint"><span>Vad tror du att det betyder?</span><span class="ao-turn" aria-hidden="true">↻</span></span>' +
      '</button>' +
      '<div class="ao-face ao-back" aria-hidden="true">' +
        '<p class="ao-lang"><span>' + L.label + '</span><span class="n">Betydelse</span></p>' +
        '<div class="ao-small"><b class="' + L.cls + '" lang="' + L.lang + '">' + esc(w[0]) + '</b><i>' + esc(w[1]) + '</i></div>' +
        '<h3 class="ao-mean">' + esc(w[2]) + '</h3>' +
        '<p class="ao-text">' + esc(w[3]) + '</p>' +
        '<div class="ao-meta"><span class="ao-tag">' + L.sub + '</span>' + (bibUrl(w[5]) ? '<a class="ao-tag ao-ref" href="' + bibUrl(w[5]) + '" target="_blank" rel="noopener" tabindex="-1" title="Läs på bibeln.se">Läs ' + esc(w[5]) + ' ↗</a>' : '<span class="ao-tag">' + esc(w[5]) + '</span>') + '<span class="ao-tag">Strong ' + esc(w[4]) + '</span></div>' +
        '<div class="ao-acts">' + listen + '<button type="button" class="ao-btn ghost" data-act="flip">↻ Vänd tillbaka</button>' +
          '<a class="ao-btn ao-more" href="' + LEARN_URL + '" tabindex="-1">Vill du lära dig mer? <span class="arr">→</span></a></div>' +
      '</div>' +
    '</div></div>';
}

var current = [];
function render(){
  var d = new Date();
  var n = dayNo(d);
  current = LANGS.map(function(L){ return pick(L.list, n + L.shift); });
  $('.ao-grid').innerHTML = LANGS.map(function(L, i){ return cardHtml(L, current[i], i); }).join('');
  var txt = d.toLocaleDateString('sv-SE', { weekday:'long', day:'numeric', month:'long' });
  $('.ao-date').textContent = 'Idag · ' + txt;
}

function setFlip(card, on){
  card.classList.toggle('is-flipped', on);
  card.querySelector('.ao-front').setAttribute('aria-hidden', on);
  card.querySelector('.ao-back').setAttribute('aria-hidden', !on);
  card.querySelectorAll('.ao-back button, .ao-back a').forEach(function(b){ b.tabIndex = on ? 0 : -1; });
  card.querySelector('.ao-front').tabIndex = on ? -1 : 0;
  var target = on ? card.querySelector('.ao-back .ao-btn.ghost') : card.querySelector('.ao-front');
  if (target) setTimeout(function(){ try { target.focus({ preventScroll:true }); } catch (e) {} }, 400);
}

root.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b || !root.contains(b)) return;
  var act = b.dataset.act;
  if (act === 'flip') { var c = b.closest('.ao-flip'); setFlip(c, !c.classList.contains('is-flipped')); }
  else if (act === 'say' && canSpeak) {
    var L = LANGS[+b.dataset.i], u = new SpeechSynthesisUtterance(current[+b.dataset.i][0]);
    u.lang = L.tts; u.rate = 0.75;
    u.onend = u.onerror = function(){ b.classList.remove('speaking'); };
    speechSynthesis.cancel(); b.classList.add('speaking'); speechSynthesis.speak(u);
  }
});
/* Tittar-streak: hur många dagar i rad besökaren kollat dagens ord (sparas bara i webbläsaren) */
(function streak(){
  var today = dayNo(new Date()), s = { last:0, n:0 };
  try { s = JSON.parse(localStorage.getItem('altord-streak') || '{"last":0,"n":0}'); } catch (e) {}
  if (s.last !== today) { s.n = s.last === today - 1 ? s.n + 1 : 1; s.last = today; }
  try { localStorage.setItem('altord-streak', JSON.stringify(s)); } catch (e) {}
  if (s.n >= 2) $('.ao-streak').innerHTML = 'Du har kollat dagens ord <b>' + s.n + ' dagar i rad</b>' + (s.n >= 40 ? ' – längre än Jesus i öknen!' : s.n >= 7 ? ' – en hel skapelsevecka!' : '');
})();
render();
})();
</script>
