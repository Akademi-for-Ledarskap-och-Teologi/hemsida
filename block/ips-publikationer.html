#alt-ips .card--dark{margin-top:110px;background:var(--ink);color:#fff;border-radius:var(--r);padding:40px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;box-shadow:var(--shadow)}

#alt-ips .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes ips-shim{to{background-position:-150% 0}}
@keyframes ips-up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@media (max-width:900px){

  #alt-ips .pub h4{font-size:16px}
  #alt-ips .card--dark{padding:28px;margin-top:80px}
}
@media (prefers-reduced-motion:reduce){#alt-ips *,#alt-ips *::before,#alt-ips *::after{animation:none!important;transition:none!important}}
</style>

      var dated = g.items.filter(function (i) { return i.year; });
      g.items.forEach(function (i) {
        i._y = i.year || (dated.slice().sort(function (a, b) { return Math.abs(a.nr - i.nr) - Math.abs(b.nr - i.nr); })[0] || {}).year || 0;
      });
      g.items.sort(function (a, b) { return b._y - a._y || (b.nr || 0) - (a.nr || 0); });
    });
    return { groups: order.map(function (k) { return groups[k]; }).filter(function (g) { return g.items.length; }), all: all };
  }

  /* ---- filtrering ---- */
  function matches(i, terms) {
    if (state.series !== 'alla' && i.series !== state.series) return false;
    if (state.format === 'pdf' && !i.id) return false;
    if (state.format === 'bok' && !i.buy) return false;
    if (!terms.length) return true;
    i._tocHit = false;
    for (var t = 0; t < terms.length; t++) {
      if (i._hay.indexOf(terms[t]) > -1) continue;
      if (i._toc.indexOf(terms[t]) > -1) { i._tocHit = true; continue; }
      return false;
    }
    return true;
  }

  function tocSnippet(i, terms) {
    var raw = i.toc || '', n = norm(raw), pos = -1, len = 0;
    terms.forEach(function (t) { var p = n.indexOf(t); if (p > -1 && pos < 0) { pos = p; len = t.length; } });
    if (pos < 0) return '';
    var a = Math.max(0, pos - 50), b = Math.min(raw.length, pos + len + 60);
    return (a ? '…' : '') + esc(raw.slice(a, pos)) + '<mark>' + esc(raw.slice(pos, pos + len)) + '</mark>' + esc(raw.slice(pos + len, b)) + (b < raw.length ? '…' : '');
  }

  function card(i, terms) {
    var sub = i.subtitle ? '<p class="pub__sub">' + esc(i.subtitle.charAt(0).toUpperCase() + i.subtitle.slice(1)) + '</p>' : '';
    var facts = [];
    if (i.publisher) facts.push(esc(i.publisher));
    if (i.isbn) facts.push('ISBN ' + esc(i.isbn));
    var act = [];
    if (i.id) act.push('<a class="pill pill--sm" href="' + esc(i.pdf) + '" target="_blank" rel="noopener" aria-label="Läs ' + esc(i.title) + ' som PDF">Läs PDF <span class="arr">→</span></a>');
    else act.push('<span class="nopdf">Endast tryckt</span>');
    if (i.buy) act.push('<a class="textlink" href="' + esc(i.buy) + '" target="_blank" rel="noopener">Köp pappersbok <span class="arr">→</span></a>');
    if (i.note) act.push('<button type="button" class="textlink" data-note aria-expanded="false">Om utgåvan</button>');
    var hit = (terms.length && i._tocHit) ? '<p class="pub__hit">Träff i innehållet: ' + tocSnippet(i, terms) + '</p>' : '';
    return '<li><article class="pub in">' +
      '<div class="pub__nr"><i>Nr</i><b>' + esc(i.nr != null ? i.nr : '–') + '</b><i>' + esc(i.year || '') + '</i></div>' +
      '<div class="pub__body">' +
        (i.authors ? '<span class="meta">' + esc(i.authors) + '</span>' : '') +
        '<h4>' + esc(i.title) + '</h4>' + sub +
        '<p class="pub__facts">' + (i.nyutgava ? '<span class="badge">Nyutgåva</span>' : '') + facts.map(function (f) { return '<span>' + f + '</span>'; }).join('') + '</p>' +
        hit +
        (i.note ? '<p class="pub__note" hidden>' + esc(i.note) + '</p>' : '') +
        '<div class="pub__act">' + act.join('') + '</div>' +
      '</div></article></li>';
  }

  function render() {
    if (!DATA) return;
    var terms = norm(state.q).split(/\s+/).filter(Boolean);
    var html = '', total = 0;
    DATA.groups.forEach(function (g) {
      var items = g.items.filter(function (i) { return matches(i, terms); });
      if (!items.length) return;
      total += items.length;
      html += '<section class="sec" id="ips-' + esc(g.key) + '"><div class="sec-head"><div>' +
        '<span class="eyebrow">Serie · ' + items.length + (items.length === 1 ? ' publikation' : ' publikationer') + '</span>' +
        '<h2>' + esc(g.title) + '</h2>' + (g.text ? '<p>' + esc(g.text) + '</p>' : '') +
        '</div></div><ul class="list">' + items.map(function (i) { return card(i, terms); }).join('') + '</ul></section>';
    });
    out.innerHTML = html || '<div class="empty">Inga publikationer matchar din sökning. <button type="button" data-reset>Visa alla</button></div>';
    countEl.textContent = total;
    liveEl.textContent = total + ' publikationer visas';
  }

  function renderChips() {
    var html = '<button type="button" class="chip' + (state.series === 'alla' ? ' is-on' : '') + '" data-s="alla" aria-pressed="' + (state.series === 'alla') + '">Alla serier</button>';
    DATA.groups.forEach(function (g) {
      var on = state.series === g.key;
      html += '<button type="button" class="chip' + (on ? ' is-on' : '') + '" data-s="' + esc(g.key) + '" aria-pressed="' + on + '">' + esc(g.chip) + '<span class="n">' + g.items.length + '</span></button>';
    });
    seriesEl.innerHTML = html;
  }

  function setOn(wrap, attr, val) {
    [].forEach.call(wrap.querySelectorAll('.chip'), function (b) { var on = b.getAttribute(attr) === val; b.classList.toggle('is-on', on); b.setAttribute('aria-pressed', on); });
  }

  /* ---- händelser ---- */
  var tmr;
  qEl.addEventListener('input', function () {
    clearTimeout(tmr);
    clearEl.hidden = !qEl.value;
    tmr = setTimeout(function () { state.q = qEl.value; render(); }, 120);
  });
  clearEl.addEventListener('click', function () { qEl.value = ''; clearEl.hidden = true; state.q = ''; render(); qEl.focus(); });
  seriesEl.addEventListener('click', function (e) { var b = e.target.closest('[data-s]'); if (!b) return; state.series = b.getAttribute('data-s'); setOn(seriesEl, 'data-s', state.series); render(); });
  formatEl.addEventListener('click', function (e) { var b = e.target.closest('[data-f]'); if (!b) return; state.format = b.getAttribute('data-f'); setOn(formatEl, 'data-f', state.format); render(); });
  out.addEventListener('click', function (e) {
    var n = e.target.closest('[data-note]');
    if (n) {
      var p = n.closest('.pub').querySelector('.pub__note');
      var open = p.hidden; p.hidden = !open; n.setAttribute('aria-expanded', open); n.textContent = open ? 'Dölj' : 'Om utgåvan';
    }
    if (e.target.closest('[data-reset]')) {
      state = { q: '', series: 'alla', format: 'alla' }; qEl.value = ''; clearEl.hidden = true;
      setOn(seriesEl, 'data-s', 'alla'); setOn(formatEl, 'data-f', 'alla'); render();
    }
  });

  /* ---- data ---- */
  function use(cat) { DATA = build(cat); renderChips(); render(); }
  var initQ = new URLSearchParams(location.search).get('q');
  if (initQ) { qEl.value = initQ; state.q = initQ; clearEl.hidden = false; }

  var cached = null;
  try { cached = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) {}
  if (cached && cached.series) use(cached);

  fetch(CFG.endpoint, { redirect: 'follow' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (cat) {
      if (!cat || !cat.series) throw new Error('tom katalog');
      try { localStorage.setItem(LS, JSON.stringify(cat)); } catch (e) {}
      use(cat);
    })
    .catch(function (err) {
      console.warn('IPS-publikationer:', err);
      if (DATA) return;                 // visar senast sparade versionen
      use({ series: [] });              // visar åtminstone de tryckta (Studia)
      out.insertAdjacentHTML('afterbegin', '<div class="empty">PDF-arkivet kunde inte hämtas just nu. Försök igen om en stund, eller öppna <a href="' + CFG.driveFolder + '" target="_blank" rel="noopener">mappen i Google Drive</a>.</div>');
    });
})();
</script>
</div>
