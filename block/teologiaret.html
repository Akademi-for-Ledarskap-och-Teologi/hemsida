<!--
  ============================================================
  ALT – TEOLOGIÅRET: KLICKBAR STUDIEPLAN (Squarespace)
  ============================================================
  INSTALLATION
  1. Öppna sidan /teologiaret i Squarespace.
  2. Lägg till ett "Code"-block (Kod) och klistra in HELA denna fil.
  3. Stäng av "Display source" om det är påslaget. Spara.
  Design: samma formspråk som kurskatalogen och ansökningsguiden.

  KURSPLANER
  Länkarna "Kursplan ↓" hämtas live från Drive-mappen "KURSPLANER HEMSIDA"
  (samma källa och cache som kurskatalogen). En kurs matchas först på
  kurskod, sedan på kursnamn i filnamnet. Hittas ingen fil länkas /kursplaner.

  KURSDATA
  Enligt Studiehandbok 2026–2027 (utbildningsplan 2026). Ändra i COURSES och
  PATHS nedan. De två rutorna är studiegångar (heltid, nästa steg)
  i stället för år. Direktlänk: #val=1–2.

  GRADIENTBILDER
  Bilderna i rutorna styrs från Drive (mappen Gradientbilder och kalkylarket
  "Gradientbilder – koppling till block"), se gradientbilder.js. Block = teologiaret,
  Ruta = Teologiåret / Nästa steg. Finjustera: altutbildning.se/teologiaret#bildfokus
  ============================================================
-->

var KP = { ids:{}, names:{} }, KP_BYNAME = {};
function kpLink(c){
  var id = KP.ids[c.code] || KP.ids[c.code + 'S'] || KP_BYNAME[norm(c.name)];
  return id ? { href:'https://drive.google.com/file/d/' + id + '/view', label:'Kursplan ↓', ext:true }
            : { href:LINKS.kursplaner, label:'Kursplaner →', ext:false };
}
function applyKp(data){
  if (!data || !data.ids) return;
  KP = { ids:data.ids, names:data.names || {} }; KP_BYNAME = {};
  Object.keys(KP.names).forEach(function(k){ var n = norm(KP.names[k]); if (n && !KP_BYNAME[n]) KP_BYNAME[n] = KP.ids[k]; });
  renderList();
}
function driveList(folderId, pageToken){
  var q = encodeURIComponent("'" + folderId + "' in parents and trashed=false");
  return fetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&key=' + DRIVE_KEY + '&pageSize=1000&orderBy=name&fields=nextPageToken,files(id,name,mimeType)' + (pageToken ? '&pageToken=' + pageToken : ''))
    .then(function(r){ if (!r.ok) throw new Error('Drive ' + r.status); return r.json(); })
    .then(function(d){ if (!d.nextPageToken) return d.files || []; return driveList(folderId, d.nextPageToken).then(function(m){ return (d.files || []).concat(m); }); });
}
function kpTitle(fileName){
  var base = (fileName.normalize ? fileName.normalize('NFC') : fileName).replace(/\.pdf$/i, '').replace(/_+/g, ' ').trim();
  base = base.replace(/\s+\d{2}\s*[–-]?\s*\d{2}\s*$/, '').trim();
  return base.replace(/^[A-Z]{2}\d{2,3}[A-Z]?\s*[-–:]?\s*/, '');
}
function syncKursplaner(){
  try { applyKp(JSON.parse(localStorage.getItem(KP_KEY) || 'null')); } catch (e) {}
  if (!window.fetch) return;
  var map = {}, names = {}, year = {};
  function take(f){
    if (!/\.pdf$/i.test(f.name)) return;
    var name = f.name.normalize ? f.name.normalize('NFC') : f.name;
    var m = name.match(/^([A-Z]{1,2}\d{2,3}[A-Z]?)/); if (!m) return;
    var y = (name.replace(/\.pdf$/i, '').match(/(\d{2})\s*[–-]?\s*(\d{2})\s*$/) || [])[1] || '00';
    if (!map[m[1]] || y > year[m[1]]) { map[m[1]] = f.id; names[m[1]] = kpTitle(name); year[m[1]] = y; }
  }
  driveList(DRIVE_FOLDER).then(function(items){
    items.forEach(take);
    var folders = items.filter(function(f){ return f.mimeType === 'application/vnd.google-apps.folder'; });
    return Promise.all(folders.map(function(fo){ return driveList(fo.id).then(function(fs){ fs.forEach(take); }); }));
  }).then(function(){
    if (!Object.keys(map).length) return;
    var data = { ids:map, names:names };
    try { localStorage.setItem(KP_KEY, JSON.stringify(data)); } catch (e) {}
    applyKp(data);
  }).catch(function(){ /* Drive svarar inte: länka till /kursplaner */ });
}

/* ---------- Gradientbilder (styrs från Drive, se gradientbilder.js) ---------- */
var GB = 'teologiaret';
function withGrad(fn){
  if (window.ALTGrad) return fn();
  var s = document.querySelector('script[data-altg]');
  if (!s){ s = document.createElement('script'); s.src = 'https://akademi-for-ledarskap-och-teologi.github.io/hemsida/gradientbilder.js'; s.setAttribute('data-altg', '1'); document.head.appendChild(s); }
  s.addEventListener('load', fn);
}
function G(){ return window.ALTGrad; }
function gOn(y){ return G() && G().entry(GB, y.label || y.name) ? ' altg-on' : ''; }
function gLay(y, where){ return G() ? G().layers(GB, y.label || y.name, where, y.c) : ''; }

/* ---------- Tillstånd ---------- */
var state = { y:0, kind:'' };
var h = location.hash.match(/val=(\d)/); if (h && +h[1] >= 1 && +h[1] <= YEARS.length) state.y = +h[1] - 1;

function currentCourses(){ return (YEARS[state.y].courses || []).map(course); }

/* ---------- Rendering ---------- */
function renderYears(){
  $('.altty-years').innerHTML = YEARS.map(function(y, i){
    return '<li><button type="button" class="altty-yr' + gOn(y) + '" role="tab" data-act="year" data-i="' + i + '" style="--tc:' + y.c + ';--tf:' + y.fg + '">' + gLay(y, 'tab') +
      '<span class="f">' + y.flag + '</span><span class="n w">' + esc(y.label) + '</span>' + (y.hideName ? '' : '<span class="t">' + esc(y.name) + '</span>') + '</button></li>';
  }).join('');
}
function syncYears(){
  $('.altty-years').classList.add('has-choice');
  root.querySelectorAll('.altty-yr').forEach(function(b, i){
    b.setAttribute('aria-selected', i === state.y); b.tabIndex = i === state.y ? 0 : -1;
  });
}
function card(c, i){
  var a = AMNEN[c.amne], f = FORMER[c.t], link = kpLink(c);
  var dim = state.kind && c.amne !== state.kind ? ' dim' : '';
  return '<article class="altty-card' + dim + '" style="--c:' + a[1] + ';animation-delay:' + (i * 40) + 'ms">' +
    '<div class="altty-card-top"><span class="code"><i></i>' + esc(c.display) + '</span><span class="hp">' +
      (c.hp ? sv(c.hp) + ' hp' : 'Se kursplan') + '</span></div>' +
    '<h4>' + esc(c.name) + '</h4>' +
    '<div class="altty-tags"><span class="altty-tag" title="' + esc(f[1]) + '">' + f[0] + '</span><span class="altty-tag">' + a[0] + '</span></div>' +
    (c.note ? '<p class="altty-msg">' + esc(c.note) + '</p>' : '') +
    '<div class="altty-actions"><a class="altty-pdf" href="' + link.href + '"' + (link.ext ? ' target="_blank" rel="noopener"' : '') + '>' + link.label + '</a></div>' +
  '</article>';
}
function renderList(){
  var el = $('.altty-list'); if (!el) return;
  var list = currentCourses();
  el.innerHTML = list.map(card).join('');
  var hp = list.reduce(function(s, c){ return s + (c.hp || 0); }, 0);
  $('.altty-count').textContent = list.length + ' kurser · ' + sv(hp) + ' hp';
}
function renderNext(y){
  return '<div class="altty-next">' + y.next.map(function(n, i){
    var g = G() && G().entry(GB, n.h);
    return '<a class="altty-nx' + (g ? ' altg-on' : '') + '" href="' + n.href + '" style="--c:' + n.c + ';--f:' + n.f + ';--tc:' + n.c + ';--tf:' + n.f + ';text-decoration:none;animation-delay:' + (i * 60) + 'ms">' +
      (g ? G().layers(GB, n.h, 'tab', n.c, 'hero') : '') +
      '<span class="k">' + esc(n.k) + '</span><h4>' + esc(n.h) + '</h4><p>' + esc(n.p) + '</p>' +
      '<ul>' + n.tags.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' +
      '<span class="altty-pill inv" style="--tf:' + n.f + ';--tc:' + n.c + '">Läs mer <span class="arr">→</span></span></a>';
  }).join('') + '</div>';
}
function renderStage(){
  var y = YEARS[state.y], prev = YEARS[state.y - 1], next = YEARS[state.y + 1];
  $('.altty-stage').innerHTML =
    '<div class="altty-hero' + gOn(y) + '" style="--tc:' + y.c + ';--tf:' + y.fg + '">' + gLay(y, 'hero') + ARCHES +
      '<div><h3>' + esc(y.title) + '</h3>' +
        '<p class="d">' + esc(y.lead) + '</p>' +
        (y.facts && y.facts.length ? '<div class="facts">' + y.facts.map(function(f){ return '<span>' + esc(f) + '</span>'; }).join('') + '</div>' : '') +
      '</div>' +
      '<div class="altty-ms"><p class="lbl">' + y.ms.lbl + '</p><b>' + y.ms.big + '</b><p>' + esc(y.ms.text) + '</p></div>' +
    '</div>' +
    (y.next ? renderNext(y) :
      '<div class="altty-listhead"><p class="altty-count"></p><div class="altty-chips" role="group" aria-label="Markera ämnesområde">' +
        KINDS.map(function(k){ return '<button type="button" class="altty-chip" data-act="kind" data-k="' + k[0] + '" aria-pressed="' + (state.kind === k[0]) + '">' + k[1] + '</button>'; }).join('') +
      '</div></div>' +
      '<div class="altty-list"></div>') +
    '<div class="altty-nav">' +
      '<button type="button" class="altty-btn ghost" data-act="go" data-d="-1"' + (prev ? '' : ' disabled') + '>← ' + (prev ? esc(prev.name) : '') + '</button>' +
      '<button type="button" class="altty-btn" data-act="go" data-d="1"' + (next ? '' : ' disabled') + '>' + (next ? esc(next.name) : '') + ' →</button>' +
    '</div>' +
    '<div class="altty-cta"><div><h4>Redo att söka?</h4><p>Ansökan till hösten är öppen 15 mars–15 april. Du läser på någon av våra studieorter: ' + ORTER + '. Grundläggande behörighet krävs – saknar du den kan du ansöka om prövning av reell kompetens.</p></div>' +
      '<div class="b"><a class="altty-pill accent" href="' + LINKS.ansokan + '">Till ansökan <span class="arr">→</span></a><a class="altty-pill line" href="' + LINKS.vagledning + '">Studievägledning</a></div></div>';
  renderList();
}
function render(){ syncYears(); renderStage(); }

/* ---------- Händelser ---------- */
function go(i, focus){
  state.y = Math.max(0, Math.min(YEARS.length - 1, i)); state.kind = '';
  try { history.replaceState(null, '', '#val=' + (state.y + 1)); } catch (e) {}
  render();
  if (focus) root.querySelectorAll('.altty-yr')[state.y].focus();
}
root.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b || !root.contains(b)) return;
  var act = b.dataset.act;
  if (act === 'year') go(+b.dataset.i);
  else if (act === 'go') { go(state.y + +b.dataset.d); try { $('.altty-years').scrollIntoView({ behavior:'smooth', block:'start' }); } catch (err) {} }
  else if (act === 'kind') {
    state.kind = state.kind === b.dataset.k ? '' : b.dataset.k;
    root.querySelectorAll('.altty-chip').forEach(function(x){ x.setAttribute('aria-pressed', x.dataset.k === state.kind); });
    renderList();
  }
});
$('.altty-years').addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight') { e.preventDefault(); go(state.y + 1, true); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(state.y - 1, true); }
});

/* ---------- Start ---------- */
renderYears(); render(); syncKursplaner();
withGrad(function(){ G().get(GB, function(){ renderYears(); render(); }); });
})();
</script>
