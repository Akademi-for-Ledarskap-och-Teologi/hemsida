}
function syncKursplaner(){
  try { applyKp(JSON.parse(localStorage.getItem(KP_KEY) || 'null')); } catch (e) {}
  if (!window.fetch) return;
  var map = {}, names = {}, year = {};
  function take(f){
    if (!/\.pdf$/i.test(f.name)) return;
    var name = f.name.normalize ? f.name.normalize('NFC') : f.name;
    var m = name.match(/^([A-Z]{1,2}\d{2,3}[A-Z]?)/); if (!m) return;
    var y = (name.replace(/\.pdf$/i, '').match(/(\d{2})\s*[–-]?\s*(\d{2})\s*$/) || [])[1] || '00';
    if (!map[m[1]] || y > year[m[1]]) { map[m[1]] = f.id; names[m[1]] = kpTitle(name); year[m[1]] = y; }
  }
  driveList(DRIVE_FOLDER).then(function(items){
    items.forEach(take);
    var folders = items.filter(function(f){ return f.mimeType === 'application/vnd.google-apps.folder'; });
    return Promise.all(folders.map(function(fo){ return driveList(fo.id).then(function(fs){ fs.forEach(take); }); }));
  }).then(function(){
    if (!Object.keys(map).length) return;
    var data = { ids:map, names:names };
    try { localStorage.setItem(KP_KEY, JSON.stringify(data)); } catch (e) {}
    applyKp(data);
  }).catch(function(){ /* Drive svarar inte: länka till /kursplaner */ });
}

/* ---------- Tillstånd ---------- */
var state = { y:0, track:'', kind:'' };
var h = location.hash.match(/ar=(\d)/); if (h && +h[1] >= 1 && +h[1] <= 3) state.y = +h[1] - 1;

function currentCourses(){
  var y = YEARS[state.y];
  var list = y.tracks ? y.tracks.filter(function(t){ return t.id === state.track; })[0].courses : y.courses;
  return list.map(course);
}

/* ---------- Rendering ---------- */
function renderYears(){
  $('.altpt-years').innerHTML = YEARS.map(function(y, i){
    return '<li><button type="button" class="altpt-yr" role="tab" data-act="year" data-i="' + i + '" style="--tc:' + y.c + ';--tf:' + y.fg + '">' +
      '<span class="f">' + y.flag + '</span><span class="n">0' + y.n + '</span><span class="l">År ' + y.n + '</span><span class="t">' + esc(y.name) + '</span></button></li>';
  }).join('');
}
function syncYears(){
  $('.altpt-years').classList.add('has-choice');
  root.querySelectorAll('.altpt-yr').forEach(function(b, i){
    b.setAttribute('aria-selected', i === state.y); b.tabIndex = i === state.y ? 0 : -1;
  });
}
function card(c){
  var a = AMNEN[c.amne], f = c.t ? FORMER[c.t] : null, link = kpLink(c);
  var dim = state.kind && (c.valbar || (c.code === 'BI250H' ? false : c.amne !== state.kind)) ? ' dim' : '';
  var tags = (f ? '<span class="altpt-tag' + (c.fhs ? ' k' : '') + '" title="' + esc(f[1]) + '">' + f[0] + '</span>' : '') +
             (!c.valbar && !c.fhs ? '<span class="altpt-tag">' + a[0] + '</span>' : '');
  return '<article class="altpt-card' + dim + '" style="--c:' + (c.valbar ? 'var(--accent)' : a[1]) + '">' +
    '<div class="altpt-card-top"><span class="code"><i></i>' + esc(c.display) + '</span><span class="hp">' +
      (c.hp ? sv(c.hp) + ' hp' : c.fhs ? 'Folkhögskolekurs' : c.valbar ? 'Valfri' : 'Se kursplan') + '</span></div>' +
    '<h4>' + esc(c.name) + '</h4>' +
    (tags ? '<div class="altpt-tags">' + tags + '</div>' : '') +
    (c.note ? '<p class="altpt-msg">' + esc(c.note) + '</p>' : '') +
    '<div class="altpt-actions"><a class="altpt-pdf" href="' + link.href + '"' + (link.ext ? ' target="_blank" rel="noopener"' : '') + '>' + link.label + '</a></div>' +
  '</article>';
}
function renderList(){
  var el = $('.altpt-list'); if (!el) return;
  var list = currentCourses();
  el.innerHTML = list.map(card).join('');
  var hp = list.reduce(function(s, c){ return s + (c.hp || 0); }, 0);
  $('.altpt-count').textContent = list.length + ' kurser' + (state.y === 0 ? ' · ' + sv(hp) + ' hp' : '');
}
function renderStage(){
  var y = YEARS[state.y], tr = y.tracks ? y.tracks.filter(function(t){ return t.id === state.track; })[0] : null;
  var prev = YEARS[state.y - 1], next = YEARS[state.y + 1];
  $('.altpt-stage').innerHTML =
    '<div class="altpt-hero" style="--tc:' + y.c + ';--tf:' + y.fg + '">' + ARCHES +
      '<div><p class="altpt-eyebrow">År ' + y.n + ' av 3</p><h3>' + esc(y.title) + '</h3>' +
        '<p class="d">' + esc(tr ? y.lead + ' ' + tr.lead : y.lead) + '</p>' +
        (y.tracks ? '<div class="altpt-tracks" role="group" aria-label="Välj inriktning">' + y.tracks.map(function(t){
          return '<button type="button" class="altpt-pill ' + (t.id === state.track ? 'inv' : 'line') + '" data-act="track" data-t="' + t.id + '" aria-pressed="' + (t.id === state.track) + '">' + esc(t.label) + '</button>';
        }).join('') + '</div>' : '') +
        (y.facts && y.facts.length ? '<div class="facts">' + y.facts.map(function(f){ return '<span>' + esc(f) + '</span>'; }).join('') + '</div>' : '') +
      '</div>' +
      '<div class="altpt-ms"><p class="lbl">' + y.ms.lbl + '</p><b>' + y.ms.big + '</b><p>' + esc(y.ms.text) + '</p></div>' +
    '</div>' +
    '<div class="altpt-listhead"><p class="altpt-count"></p><div class="altpt-chips" role="group" aria-label="Markera ämnesområde">' +
      KINDS.map(function(k){ return '<button type="button" class="altpt-chip" data-act="kind" data-k="' + k[0] + '" aria-pressed="' + (state.kind === k[0]) + '">' + k[1] + '</button>'; }).join('') +
    '</div></div>' +
    '<div class="altpt-list"></div>' +
    '<div class="altpt-nav">' +
      '<button type="button" class="altpt-btn ghost" data-act="go" data-d="-1"' + (prev ? '' : ' disabled') + '>← ' + (prev ? 'År ' + prev.n : '') + '</button>' +
      '<button type="button" class="altpt-btn" data-act="go" data-d="1"' + (next ? '' : ' disabled') + '>' + (next ? 'År ' + next.n : '') + ' →</button>' +
    '</div>' +
    '<div class="altpt-cta"><div><h4>Redo att söka?</h4><p>Ansökan till hösten är öppen 15 mars–15 april. Osäker på vilken studiegång som passar dig? Prata med studievägledningen.</p></div>' +
      '<div class="b"><a class="altpt-pill accent" href="' + LINKS.ansokan + '">Till ansökan <span class="arr">→</span></a><a class="altpt-pill line" href="' + LINKS.vagledning + '">Studievägledning</a></div></div>';
  renderList();
}
function render(){ syncYears(); renderStage(); }

/* ---------- Händelser ---------- */
function go(i, focus){
  state.y = Math.max(0, Math.min(YEARS.length - 1, i)); state.kind = '';
  try { history.replaceState(null, '', '#ar=' + (state.y + 1)); } catch (e) {}
  render();
  if (focus) root.querySelectorAll('.altpt-yr')[state.y].focus();
}
root.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b || !root.contains(b)) return;
  var act = b.dataset.act;
  if (act === 'year') go(+b.dataset.i);
  else if (act === 'go') { go(state.y + +b.dataset.d); try { $('.altpt-years').scrollIntoView({ behavior:'smooth', block:'start' }); } catch (err) {} }
  else if (act === 'track') { state.track = b.dataset.t; render(); }
  else if (act === 'kind') {
    state.kind = state.kind === b.dataset.k ? '' : b.dataset.k;
    root.querySelectorAll('.altpt-chip').forEach(function(x){ x.setAttribute('aria-pressed', x.dataset.k === state.kind); });
    renderList();
  }
});
$('.altpt-years').addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight') { e.preventDefault(); go(state.y + 1, true); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(state.y - 1, true); }
});

/* ---------- Start ---------- */
renderYears(); render(); syncKursplaner();
})();
</script>
