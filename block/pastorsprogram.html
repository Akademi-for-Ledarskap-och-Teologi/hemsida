function driveList(folderId, pageToken){
  var q = encodeURIComponent("'" + folderId + "' in parents and trashed=false");
  return fetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&key=' + DRIVE_KEY + '&pageSize=1000&orderBy=name&fields=nextPageToken,files(id,name,mimeType)' + (pageToken ? '&pageToken=' + pageToken : ''))
    .then(function(r){ if (!r.ok) throw new Error('Drive ' + r.status); return r.json(); })
    .then(function(d){ if (!d.nextPageToken) return d.files || []; return driveList(folderId, d.nextPageToken).then(function(m){ return (d.files || []).concat(m); }); });
}
function kpTitle(fileName){
  var base = (fileName.normalize ? fileName.normalize('NFC') : fileName).replace(/\.pdf$/i, '').replace(/_+/g, ' ').trim();
  base = base.replace(/\s+\d{2}\s*[–-]?\s*\d{2}\s*$/, '').trim();
  return base.replace(/^[A-Z]{2}\d{2,3}[A-Z]?\s*[-–:]?\s*/, '');
}
function syncKursplaner(){
  try { applyKp(JSON.parse(localStorage.getItem(KP_KEY) || 'null')); } catch (e) {}
  if (!window.fetch) return;
  var map = {}, names = {}, year = {};
  function take(f){
    if (!/\.pdf$/i.test(f.name)) return;
    var name = f.name.normalize ? f.name.normalize('NFC') : f.name;
    var m = name.match(/^([A-Z]{1,2}\d{2,3}[A-Z]?)/); if (!m) return;
    var y = (name.replace(/\.pdf$/i, '').match(/(\d{2})\s*[–-]?\s*(\d{2})\s*$/) || [])[1] || '00';
    if (!map[m[1]] || y > year[m[1]]) { map[m[1]] = f.id; names[m[1]] = kpTitle(name); year[m[1]] = y; }
  }
  driveList(DRIVE_FOLDER).then(function(items){
    items.forEach(take);
    var folders = items.filter(function(f){ return f.mimeType === 'application/vnd.google-apps.folder'; });
    return Promise.all(folders.map(function(fo){ return driveList(fo.id).then(function(fs){ fs.forEach(take); }); }));
  }).then(function(){
    if (!Object.keys(map).length) return;
    var data = { ids:map, names:names };
    try { localStorage.setItem(KP_KEY, JSON.stringify(data)); } catch (e) {}
    applyKp(data);
  }).catch(function(){ /* Drive svarar inte: länka till /kursplaner */ });
}

/* ---------- Gradientbilder (styrs från Drive, se gradientbilder.js) ---------- */
var GB = 'pastorsprogram';
function withGrad(fn){
  if (window.ALTGrad) return fn();
  var s = document.querySelector('script[data-altg]');
  if (!s){ s = document.createElement('script'); s.src = 'https://akademi-for-ledarskap-och-teologi.github.io/hemsida/gradientbilder.js'; s.setAttribute('data-altg', '1'); document.head.appendChild(s); }
  s.addEventListener('load', fn);
}
function G(){ return window.ALTGrad; }
function gOn(y){ return G() && G().entry(GB, y.name) ? ' altg-on' : ''; }
function gLay(y, where){ return G() ? G().layers(GB, y.name, where, y.c) : ''; }

/* ---------- Tillstånd ---------- */
var state = { y:0, track:'fork', kind:'' };
var h = location.hash.match(/ar=(\d)/); if (h && +h[1] >= 1 && +h[1] <= 4) state.y = +h[1] - 1;

function currentCourses(){
  var y = YEARS[state.y];
  var list = y.tracks ? y.tracks.filter(function(t){ return t.id === state.track; })[0].courses : y.courses;
  return list.map(course);
}

/* ---------- Rendering ---------- */
function renderYears(){
  $('.altap-years').innerHTML = YEARS.map(function(y, i){
    return '<li><button type="button" class="altap-yr' + gOn(y) + '" role="tab" data-act="year" data-i="' + i + '" style="--tc:' + y.c + ';--tf:' + y.fg + '">' + gLay(y, 'tab') +
      '<span class="f">' + y.flag + '</span><span class="n">År ' + y.n + '</span><span class="t">' + esc(y.name) + '</span></button></li>';
  }).join('');
}
function syncYears(){
  $('.altap-years').classList.add('has-choice');
  root.querySelectorAll('.altap-yr').forEach(function(b, i){
    b.setAttribute('aria-selected', i === state.y); b.tabIndex = i === state.y ? 0 : -1;
  });
}
function card(c){
  var a = AMNEN[c.amne], f = c.t ? FORMER[c.t] : null, link = kpLink(c);
  var dim = state.kind && ((state.kind === 'hs' && c.fhs) || (state.kind !== 'hs' && c.t !== state.kind)) ? ' dim' : '';
  var tags = (f ? '<span class="altap-tag' + (c.fhs ? ' k' : '') + '" title="' + esc(f[1]) + '">' + f[0] + '</span>' : '') +
             (!c.valbar && !c.fhs ? '<span class="altap-tag">' + a[0] + '</span>' : '');
  return '<article class="altap-card' + dim + '" style="--c:' + (c.valbar ? 'var(--accent)' : a[1]) + '">' +
    '<div class="altap-card-top"><span class="code"><i></i>' + esc(c.display) + '</span><span class="hp">' +
      (c.hp ? sv(c.hp) + ' hp' : c.fhs ? 'Folkhögskolekurs' : c.valbar ? 'Valfri' : 'Se kursplan') + '</span></div>' +
    '<h4>' + esc(c.name) + '</h4>' +
    (tags ? '<div class="altap-tags">' + tags + '</div>' : '') +
    (c.note ? '<p class="altap-msg">' + esc(c.note) + '</p>' : '') +
    '<div class="altap-actions"><a class="altap-pdf" href="' + link.href + '"' + (link.ext ? ' target="_blank" rel="noopener"' : '') + '>' + link.label + '</a></div>' +
  '</article>';
}
function renderList(){
  var el = $('.altap-list'); if (!el) return;
  var list = currentCourses();
  el.innerHTML = list.map(card).join('');
  var hp = list.reduce(function(s, c){ return s + (c.hp || 0); }, 0);
  $('.altap-count').textContent = list.length + ' kurser' + (state.y === 0 ? ' · ' + sv(hp) + ' hp' : '');
}
function renderStage(){
  var y = YEARS[state.y], tr = y.tracks ? y.tracks.filter(function(t){ return t.id === state.track; })[0] : null;
  var prev = YEARS[state.y - 1], next = YEARS[state.y + 1];
  $('.altap-stage').innerHTML =
    '<div class="altap-hero' + gOn(y) + '" style="--tc:' + y.c + ';--tf:' + y.fg + '">' + gLay(y, 'hero') + ARCHES +
      '<div><p class="altap-eyebrow">År ' + y.n + ' av 4</p><h3>' + esc(y.title) + '</h3>' +
        '<p class="d">' + esc(tr ? y.lead + ' ' + tr.lead : y.lead) + '</p>' +
        (y.tracks ? '<div class="altap-tracks" role="group" aria-label="Välj inriktning">' + y.tracks.map(function(t){
          return '<button type="button" class="altap-pill ' + (t.id === state.track ? 'inv' : 'line') + '" data-act="track" data-t="' + t.id + '" aria-pressed="' + (t.id === state.track) + '">' + esc(t.label) + '</button>';
        }).join('') + '</div>' : '') +
        (y.facts && y.facts.length ? '<div class="facts">' + y.facts.map(function(f){ return '<span>' + esc(f) + '</span>'; }).join('') + '</div>' : '') +
      '</div>' +
      '<div class="altap-ms"><p class="lbl">' + y.ms.lbl + '</p><b>' + y.ms.big + '</b><p>' + esc(y.ms.text) + '</p></div>' +
    '</div>' +
    '<div class="altap-listhead"><p class="altap-count"></p><div class="altap-chips" role="group" aria-label="Markera kurstyp">' +
      KINDS.map(function(k){ return '<button type="button" class="altap-chip" data-act="kind" data-k="' + k[0] + '" aria-pressed="' + (state.kind === k[0]) + '">' + k[1] + '</button>'; }).join('') +
    '</div></div>' +
    '<div class="altap-list"></div>' +
    '<div class="altap-nav">' +
      '<button type="button" class="altap-btn ghost" data-act="go" data-d="-1"' + (prev ? '' : ' disabled') + '>← ' + (prev ? 'År ' + prev.n : '') + '</button>' +
      '<button type="button" class="altap-btn" data-act="go" data-d="1"' + (next ? '' : ' disabled') + '>' + (next ? 'År ' + next.n : '') + ' →</button>' +
    '</div>' +
    '<div class="altap-cta"><div><h4>Redo att söka?</h4><p>Ansökan till hösten är öppen 15 mars–15 april. Osäker på vilken studiegång som passar dig? Prata med studievägledningen.</p></div>' +
      '<div class="b"><a class="altap-pill accent" href="' + LINKS.ansokan + '">Till ansökan <span class="arr">→</span></a><a class="altap-pill line" href="' + LINKS.vagledning + '">Studievägledning</a></div></div>';
  renderList();
}
function render(){ syncYears(); renderStage(); }

/* ---------- Händelser ---------- */
function go(i, focus){
  state.y = Math.max(0, Math.min(3, i)); state.kind = '';
  try { history.replaceState(null, '', '#ar=' + (state.y + 1)); } catch (e) {}
  render();
  if (focus) root.querySelectorAll('.altap-yr')[state.y].focus();
}
root.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b || !root.contains(b)) return;
  var act = b.dataset.act;
  if (act === 'year') go(+b.dataset.i);
  else if (act === 'go') { go(state.y + +b.dataset.d); try { $('.altap-years').scrollIntoView({ behavior:'smooth', block:'start' }); } catch (err) {} }
  else if (act === 'track') { state.track = b.dataset.t; render(); }
  else if (act === 'kind') {
    state.kind = state.kind === b.dataset.k ? '' : b.dataset.k;
    root.querySelectorAll('.altap-chip').forEach(function(x){ x.setAttribute('aria-pressed', x.dataset.k === state.kind); });
    renderList();
  }
});
$('.altap-years').addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight') { e.preventDefault(); go(state.y + 1, true); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(state.y - 1, true); }
});

/* ---------- Start ---------- */
renderYears(); render(); syncKursplaner();
withGrad(function(){ G().get(GB, function(){ renderYears(); render(); }); });
})();
</script>
