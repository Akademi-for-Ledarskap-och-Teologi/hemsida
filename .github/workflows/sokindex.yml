# Bygger sökindexet (sokindex.json) som sökblocket använder.
# Körs varje natt, när ett kodblock ändras och när man trycker "Run workflow" under Actions.
name: Bygg sökindex

on:
  schedule:
    - cron: '17 2 * * *'          # varje natt (UTC)
  push:
    branches: [main]
    paths: ['block/**', 'loader.js', 'gradientbilder.js']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sokindex
  cancel-in-progress: true

jobs:
  bygg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vänta på att GitHub Pages har publicerat ändringen
        if: github.event_name == 'push'
        run: sleep 150
      - name: Installera puppeteer-core
        run: npm install --no-save --no-package-lock puppeteer-core@23
      - name: Gå igenom altutbildning.se
        run: CHROME="$(which google-chrome || which chromium)" node verktyg/bygg-sokindex.mjs
      - name: Spara sokindex.json
        run: |
          git config user.name "ALT sökindex"
          git config user.email "actions@users.noreply.github.com"
          git add sokindex.json
          if git diff --cached --quiet; then echo "Inga ändringar"; exit 0; fi
          git commit -m "Uppdatera sökindex"
          git pull --rebase origin main
          git push
